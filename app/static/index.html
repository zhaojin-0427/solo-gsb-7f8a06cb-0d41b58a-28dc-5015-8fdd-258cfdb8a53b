<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>静态教程离线封包工具</title>
<style>
  :root {
    --bg: #f4f6fa; --card: #fff; --line: #dfe5ee; --ink: #1f2937;
    --muted: #6b7280; --brand: #2563eb; --red: #dc2626; --red-bg:#fef2f2;
    --amber: #b45309; --amber-bg:#fffbeb; --green:#15803d; --green-bg:#f0fdf4;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
         background:var(--bg); color:var(--ink); line-height:1.55; }
  header { background:linear-gradient(135deg,#1e3a8a,#2563eb); color:#fff; padding:22px 28px; }
  header h1 { margin:0; font-size:20px; font-weight:650; }
  header p { margin:6px 0 0; opacity:.85; font-size:13px; }
  main { max-width:1080px; margin:24px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:20px; margin-bottom:18px; }
  .rules { font-size:13px; color:var(--muted); }
  .rules ul { margin:8px 0 0; padding-left:20px; }
  #drop { border:2px dashed #9db5e8; border-radius:10px; padding:38px; text-align:center;
          background:#f8faff; cursor:pointer; transition:.15s; }
  #drop.drag { background:#eaf1ff; border-color:var(--brand); }
  #drop strong { color:var(--brand); }
  #drop .hint { color:var(--muted); font-size:13px; margin-top:6px; }
  input[type=file] { display:none; }
  button { font:inherit; border:0; border-radius:8px; padding:10px 20px; cursor:pointer; }
  #downloadBtn { background:var(--green); color:#fff; font-weight:600; }
  #downloadBtn:disabled { background:#cbd5e1; cursor:not-allowed; }
  .banner { display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:8px;
            font-size:14px; margin-bottom:14px; }
  .banner.ok { background:var(--green-bg); color:var(--green); border:1px solid #bbf7d0; }
  .banner.no { background:var(--red-bg); color:var(--red); border:1px solid #fecaca; }
  .stat-row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:6px; }
  .stat { background:#f8fafc; border:1px solid var(--line); border-radius:8px;
          padding:10px 16px; font-size:13px; }
  .stat b { font-size:18px; display:block; }
  h2 { font-size:15px; margin:0 0 12px; display:flex; align-items:center; gap:8px; }
  .badge { font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px; }
  .badge.red { background:var(--red-bg); color:var(--red); }
  .badge.amber { background:var(--amber-bg); color:var(--amber); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; background:#fafbfd; position:sticky; top:0; }
  .src { font-family:var(--mono); font-size:12px; }
  .url { font-family:var(--mono); font-size:12px; word-break:break-all; }
  .tag { font-family:var(--mono); font-size:11px; background:#eef2ff; color:#3730a3;
         padding:1px 7px; border-radius:5px; white-space:nowrap; }
  .tag.html{background:#fef3c7;color:#92400e;} .tag.css{background:#dbeafe;color:#1e40af;}
  .tag.png,.tag.jpeg{background:#dcfce7;color:#166534;} .tag.off{background:#fee2e2;color:#991b1b;}
  details { margin-bottom:18px; }
  summary { cursor:pointer; font-weight:600; font-size:15px; padding:4px 0; }
  .empty { color:var(--muted); font-size:13px; }
  #spinner { display:none; margin-left:10px; }
  .err { color:var(--red); font-size:13px; margin-top:8px; }
  .hidden { display:none; }
  .code-tag { font-family:var(--mono); background:#f1f5f9; padding:1px 6px; border-radius:4px; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>静态教程离线封包工具</h1>
  <p>资料管理员专用 · 上传 ZIP 教程包，自动校验、改写内链并重扫，产出完全离线可用的封包</p>
</header>
<main>
  <section class="card rules">
    封包要求：压缩后 ≤ <b>10 MB</b>，解压后 ≤ <b>30 MB</b>；最多 <b>12</b> 个 UTF-8 HTML/CSS 文件、
    <b>30</b> 张 PNG/JPEG；根目录必须有 <span class="code-tag">index.html</span>。
    仅处理 <span class="code-tag">a[href]</span>、<span class="code-tag">img[src]</span>、
    <span class="code-tag">link[rel=stylesheet][href]</span> 与 CSS <span class="code-tag">url()</span>。
    含脚本、表单、内联样式、srcset 或 CSS @import 等内容将禁止下载。
  </section>

  <section class="card">
    <label id="drop" for="fileInput">
      <div style="font-size:15px">点击选择，或把 ZIP 拖到此处 · <strong>选择 ZIP 压缩包</strong></div>
      <div class="hint">分析在服务端内存中进行，任务结果保留 30 分钟</div>
      <input id="fileInput" type="file" accept=".zip,application/zip">
    </label>
    <div id="uploadErr" class="err hidden"></div>
  </section>

  <div id="result" class="hidden">
    <section class="card">
      <div id="banner"></div>
      <div class="stat-row" id="stats"></div>
      <button id="downloadBtn" disabled>下载离线封包 ZIP</button>
      <span id="spinner">处理中…</span>
    </section>

    <details id="problemsDetails" open>
      <summary>阻塞问题 <span id="problemCount" class="badge red">0</span></summary>
      <div class="card"><div id="problems"></div></div>
    </details>

    <details>
      <summary>提示与外部链接 <span id="noticeCount" class="badge amber">0</span></summary>
      <div class="card"><div id="notices"></div></div>
    </details>

    <details>
      <summary>包内文件清单</summary>
      <div class="card"><div id="files"></div></div>
    </details>

    <details>
      <summary>解析出的引用明细</summary>
      <div class="card"><div id="refs"></div></div>
    </details>
  </div>
</main>
<script src="/static/app.js"></script>
</body>
</html>
